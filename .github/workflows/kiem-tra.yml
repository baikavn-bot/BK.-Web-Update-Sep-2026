# KIỂM TRA TỰ ĐỘNG (CI — Continuous Integration)
# ==============================================
# Mỗi lần có commit được push lên GitHub (bất kỳ nhánh nào), GitHub tự mượn
# một máy Linux, tải code về và chạy đúng những lệnh mà agent phải chạy tay
# trước khi báo "xong". Kết quả hiện ở tab "Actions" của repo và cạnh mỗi
# commit: ✓ xanh = qua · ✗ đỏ = hỏng, bấm vào để xem bước nào hỏng.
#
# Việc này KHÔNG chặn Vercel deploy — Vercel vẫn dựng bản preview như cũ.
# CI CHẶN gộp vào `main` khi đỏ: ruleset `bao-ve-main` (bật 04/10/2026) bắt
# buộc job `kiem-tra` xanh. Đổi tên job này thì phải sửa cả ruleset.
#
# Không cần khoá bí mật nào: các bước dưới không gửi mail, không gọi Vercel.

name: Kiem tra

on:
  push:
    branches: ['**']
  workflow_dispatch:      # cho phép bấm chạy tay ở tab Actions

permissions:
  contents: read          # chỉ đọc code — không ghi gì lên repo

concurrency:              # push liên tiếp → huỷ lượt cũ, chỉ chạy lượt mới nhất
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kiem-tra:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Tải code
        uses: actions/checkout@v7

      # MỘT bản Node cho mọi bước (13/10/2026): .nvmrc = 24, khớp `engines` trong
      # package.json và Node 24.x trên Vercel. Node 24 đọc thẳng file .ts nên
      # 2 bài kiểm ước tính / chẩn đoán dưới không cần đổi bản Node nữa.
      - name: Cài Node đúng bản của repo (.nvmrc = 24)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Cài pnpm đúng bản ghi trong package.json
        run: npm install -g pnpm@9.12.0

      - name: Cài thư viện theo đúng pnpm-lock.yaml
        run: pnpm install --frozen-lockfile

      - name: Dựng site (kiểm kiểu + build) — phải 0 lỗi
        run: pnpm build

      - name: Luật tĩnh — màu viết cứng, #FFFFFF, khoá bí mật
        run: pnpm kiem-tra

      # Chỉ chạy khi nhánh có công cụ ước tính (Remote Office). Nhánh `main` trước
      # khi gộp Remote Office chưa có file này → bỏ qua bước dưới, không báo đỏ.
      - name: Công cụ ước tính Remote Office — phải 11/11
        if: hashFiles('tools/kiem-tra-uoc-tinh.mts') != ''
        run: node --experimental-strip-types tools/kiem-tra-uoc-tinh.mts

      # 5 công cụ chẩn đoán (logic giữ y v1).
      - name: 5 công cụ chẩn đoán — phải đúng hết các ca
        if: hashFiles('tools/kiem-tra-chan-doan.mts') != ''
        run: node --experimental-strip-types tools/kiem-tra-chan-doan.mts
