<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BAIKA · Về chúng tôi</title>
<style>
  @property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
  :root{--R:250px}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#060912;color:#EDF1F9;font-family:system-ui,'Segoe UI',sans-serif;height:100vh;overflow:hidden}
  @media(max-width:1024px){:root{--R:188px}}@media(max-width:640px){:root{--R:132px}}
  #bg{position:fixed;inset:0;z-index:0}
  .vignette{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(circle at 50% 46%,transparent 42%,rgba(2,4,10,.66) 100%)}
  main{position:fixed;inset:0;z-index:2;display:flex;align-items:center;justify-content:center}
  .title{position:absolute;top:9%;width:100%;text-align:center;z-index:3;pointer-events:none}
  .eyebrow{display:inline-flex;align-items:center;gap:.6rem;padding:.5rem 1.15rem;border-radius:9999px;background:rgba(255,255,255,.04);border:1px solid rgba(201,168,107,.28);margin-bottom:1rem;backdrop-filter:blur(6px)}
  .eyebrow b{width:7px;height:7px;border-radius:50%;background:#C9A86B;box-shadow:0 0 10px #C9A86B}
  .eyebrow span{font-size:.7rem;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:#C9A86B}
  h1{font-size:clamp(2rem,4vw,3rem);font-weight:700}
  .sub{color:#6B7A9C;font-size:.92rem;margin-top:.7rem}

  .stage{position:relative;width:calc(var(--R)*2);height:calc(var(--R)*2);display:flex;align-items:center;justify-content:center}
  .orbit{position:absolute;inset:0}
  .node{position:absolute;left:50%;top:50%}
  .float{animation:flo 4s ease-in-out infinite}
  .node3d{position:relative;width:120px;height:120px;display:flex;align-items:center;justify-content:center;cursor:pointer}
  @media(max-width:640px){.node3d{width:96px;height:96px}}
  .aura{position:absolute;inset:-22px;border-radius:50%;background:radial-gradient(circle,var(--c),transparent 70%);opacity:.5;animation:auraPulse 3.8s ease-in-out infinite;z-index:0}
  .bezel{position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 6%,var(--c) 14%,transparent 30% 56%,var(--c) 64%,transparent 80% 100%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 3px));opacity:.6;animation:spin 9s linear infinite;z-index:1}
  .spark{position:absolute;inset:-6px;animation:spin 6.5s linear infinite;z-index:1}
  .spark::after{content:"";position:absolute;top:-3px;left:50%;width:6px;height:6px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c),0 0 4px #fff;transform:translateX(-50%)}
  .orb{position:relative;width:100%;height:100%;border-radius:50%;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#EAF4FF;background:radial-gradient(circle at 50% 26%, rgba(190,234,255,.5), rgba(79,229,255,.16) 34%, rgba(13,22,44,.92) 74%);border:1px solid rgba(160,205,255,.4);box-shadow:inset 0 7px 15px rgba(255,255,255,.32), inset 0 -16px 30px var(--cg), inset 0 0 32px rgba(79,229,255,.16), 0 24px 46px -16px rgba(0,0,0,.85), 0 0 30px -6px var(--c);transition:transform .35s, box-shadow .35s, border-color .35s}
  .node3d:hover .orb{transform:scale(1.07);border-color:rgba(190,230,255,.7);box-shadow:inset 0 7px 16px rgba(255,255,255,.42), inset 0 -18px 34px var(--cg), inset 0 0 36px rgba(79,229,255,.22), 0 24px 46px -14px rgba(0,0,0,.85), 0 0 40px -2px var(--c)}
  .node3d:hover .aura{opacity:.85}
  .shine{position:absolute;top:13%;left:22%;width:46%;height:32%;border-radius:50%;background:radial-gradient(circle at 42% 40%,rgba(255,255,255,.9),transparent 72%);filter:blur(2px);opacity:.8;pointer-events:none;z-index:3}
  .orb .ic{color:#CFF3FF;display:flex;filter:drop-shadow(0 0 6px rgba(79,229,255,.6));z-index:4}
  .orb .lb{font-size:.76rem;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.5);z-index:4}
  .orb .sb{font-size:.5rem;letter-spacing:.2em;text-transform:uppercase;color:#9FE6FF;opacity:.9;z-index:4}

  .hub{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:5;display:flex;align-items:center;justify-content:center}
  .halo{position:absolute;width:236px;height:236px;border-radius:50%;background:radial-gradient(circle,rgba(79,229,255,.18),transparent 66%);animation:halo 3.6s ease-in-out infinite}
  .charge{position:absolute;width:196px;height:196px;border-radius:50%;background:conic-gradient(from 0deg,transparent,rgba(201,168,107,.4),transparent 38%);filter:blur(4px);animation:spin 16s linear infinite}
  .core{position:relative;width:160px;height:160px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 36%, rgba(79,229,255,.13), rgba(10,15,30,.96));border:1px solid rgba(201,168,107,.5);box-shadow:inset 0 0 30px rgba(79,229,255,.15), 0 0 50px -8px rgba(79,229,255,.28);animation:flo 5s ease-in-out infinite;cursor:pointer;transition:box-shadow .4s,transform .4s}
  .core:hover{transform:translateY(-2px);box-shadow:inset 0 0 36px rgba(79,229,255,.22), 0 0 70px -6px rgba(201,168,107,.5)}
  .core img{width:106px;height:auto;filter:drop-shadow(0 4px 14px rgba(79,229,255,.42))}
  .core::after{content:"Tên thương hiệu";position:absolute;bottom:-24px;left:50%;transform:translateX(-50%);font-size:.54rem;letter-spacing:.26em;text-transform:uppercase;color:#C9A86B;opacity:0;transition:opacity .4s;white-space:nowrap}
  .core:hover::after{opacity:.85}

  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes flo{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  @keyframes auraPulse{0%,100%{opacity:.42;transform:scale(.95)}50%{opacity:.8;transform:scale(1.07)}}
  @keyframes halo{0%,100%{opacity:.4;transform:scale(.92)}50%{opacity:.8;transform:scale(1.1)}}

  .field{position:absolute;inset:-6%;width:112%;height:112%;overflow:visible;z-index:0;pointer-events:none}
  .ring{fill:none;stroke-linecap:round}
  .beams{position:absolute;inset:0;width:100%;height:100%;overflow:visible;z-index:1;pointer-events:none}
  .bbase{stroke:rgba(120,200,255,.13);stroke-width:.5}
  .bflow{stroke:#BFefff;stroke-width:.9;stroke-dasharray:3 22;animation:beamRun 2.6s linear infinite}
  .bflow2{stroke:#7FE0FF;stroke-width:.7;stroke-dasharray:2 30;animation:beamRun 3.6s linear infinite;opacity:.7}
  @keyframes beamRun{to{stroke-dashoffset:-50}}
  /* ===== Overlay + Panel (động, nhiều lớp) ===== */
  .overlay{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:22px;background:rgba(2,4,10,.72);backdrop-filter:blur(17px);animation:ov .4s ease}
  .overlay.on{display:flex}@keyframes ov{from{opacity:0}to{opacity:1}}
  .panel{width:100%;max-width:740px;position:relative;border-radius:26px;transform-style:preserve-3d;transition:transform .2s ease-out}
  .panel::before{content:"";position:absolute;inset:0;border-radius:26px;padding:1px;background:conic-gradient(from var(--ang), transparent, var(--accent) 12%, transparent 26%, transparent 60%, var(--accent) 72%, transparent 86%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.55;animation:rot 9s linear infinite;pointer-events:none}
  @keyframes rot{to{--ang:360deg}}
  .pinner{position:relative;border-radius:26px;padding:clamp(1.8rem,4vw,3.1rem);overflow:hidden;background:var(--pbg);border:1px solid var(--pbd);box-shadow:0 50px 120px rgba(0,0,0,.85), 0 0 70px var(--pgl) inset;animation:pin .6s cubic-bezier(.16,1,.3,1)}
  @keyframes pin{from{opacity:0;transform:translateY(26px) scale(.96)}to{opacity:1;transform:none}}
  .sheen{position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.06) 48%,transparent 62%);transform:translateX(-100%);animation:sh 1.25s .3s ease forwards;pointer-events:none}@keyframes sh{to{transform:translateX(100%)}}
  .glow1{position:absolute;width:200px;height:200px;border-radius:50%;filter:blur(40px);pointer-events:none;animation:drift1 12s ease-in-out infinite}
  .glow2{position:absolute;width:170px;height:170px;border-radius:50%;filter:blur(38px);pointer-events:none;animation:drift2 14s ease-in-out infinite}
  @keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(24px,18px)}}
  @keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-22px,-16px)}}
  .reveal{opacity:0;animation:rise .6s cubic-bezier(.16,1,.3,1) forwards;animation-delay:var(--d,0s)}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .topline{position:absolute;top:0;left:0;right:0;height:3px}
  .tag{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:9999px;font-size:.76rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:1.3rem}
  .panel h2{font-size:clamp(1.5rem,3vw,2.15rem);margin-bottom:1.4rem;line-height:1.3;font-weight:700}
  .panel p{color:#A7B4CC;font-size:1.05rem;line-height:1.85;margin-bottom:1rem;white-space:pre-line}
  .close{position:absolute;top:18px;right:18px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:11px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);color:#9AA7C0;cursor:pointer;font-size:18px;transition:.2s;z-index:6}.close:hover{background:rgba(255,255,255,.12);color:#fff;transform:rotate(90deg)}
  .ghost{font-size:clamp(3.6rem,9vw,5.6rem);font-weight:800;position:absolute;top:-20px;left:-4px;line-height:1;user-select:none}
  .bar{height:3px;background:rgba(255,255,255,.06);border-radius:2px;margin-top:1.8rem;overflow:hidden}.bar>i{display:block;height:100%;border-radius:2px;transition:width .5s cubic-bezier(.16,1,.3,1)}
  .ctrl{display:flex;align-items:center;justify-content:space-between;margin-top:1.25rem}
  .nav{width:48px;height:48px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);color:#EDF1F9;cursor:pointer;font-size:21px;transition:.2s}.nav:hover{background:#fff;color:#0A1228}
  .dots{display:flex;gap:7px}.dots i{width:8px;height:8px;border-radius:4px;background:rgba(255,255,255,.2);cursor:pointer;transition:all .3s}
  .cnt{font-size:.82rem;color:#5E6E91;min-width:58px;text-align:right}
  /* brand */
  .bp-eyebrow{display:inline-flex;align-items:center;gap:8px;padding:7px 15px;border-radius:9999px;background:rgba(201,168,107,.12);border:1px solid rgba(201,168,107,.25);color:#E6CB92;font-size:.72rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;margin-bottom:1.4rem}
  .bp-head{display:flex;align-items:center;gap:20px;margin-bottom:1.7rem}
  .bp-emblem{width:64px;height:auto;flex-shrink:0;filter:drop-shadow(0 4px 14px rgba(79,229,255,.4));animation:flo 5s ease-in-out infinite}
  .bp-word{display:flex;gap:.12em;line-height:1}
  .bp-word .grp{position:relative;font-size:clamp(2.1rem,5.4vw,3.1rem);font-weight:800;letter-spacing:.06em;padding-bottom:8px}
  .bp-word .g1{color:#CFEFFF}.bp-word .g2{color:#9FD8EF}
  .bp-word .grp::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--u);transform:scaleX(0);transform-origin:left;animation:drawX .7s cubic-bezier(.16,1,.3,1) forwards;animation-delay:var(--d,.4s)}
  @keyframes drawX{to{transform:scaleX(1)}}
  .bp-tag{color:#8597B6;font-size:.86rem;margin-top:10px}
  .pillars{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:.3rem 0 1.3rem}
  @media(max-width:640px){.pillars{grid-template-columns:1fr}.bp-head{gap:14px}}
  .pillar{position:relative;border-radius:16px;padding:1.3rem 1.35rem 1.35rem 1.5rem;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012));border:1px solid rgba(255,255,255,.07);overflow:hidden;transition:transform .3s, border-color .3s}
  .pillar:hover{transform:translateY(-3px);border-color:var(--pc)}
  .pillar::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:3px;background:var(--pc)}
  .pillar::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,var(--pg),transparent 70%);opacity:.5}
  .pillar .abbr{display:inline-block;font-size:.74rem;font-weight:800;letter-spacing:.22em;color:var(--pc);margin-bottom:.5rem}
  .pillar h3{font-size:1.04rem;font-weight:700;color:#EAF2FF;margin:0 0 .55rem;line-height:1.35}
  .pillar p{color:#9FACC6;font-size:.95rem;line-height:1.7;margin:0}
  .pillar .pic{position:absolute;top:16px;right:16px;color:var(--pc);opacity:.5}
  .goal{position:relative;padding:1.15rem 1.4rem 1.15rem 1.5rem;border-radius:15px;background:linear-gradient(90deg,rgba(201,168,107,.14),rgba(201,168,107,.03));border:1px solid rgba(201,168,107,.22);overflow:hidden}
  .goal::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:3px;background:linear-gradient(#E6CB92,#C9A86B)}
  .goal .gl{display:inline-flex;align-items:center;gap:7px;font-size:.7rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:#E6CB92;margin-bottom:.4rem}
  .goal p{color:#D7E0F0;font-size:1rem;line-height:1.7;margin:0}
  .corner{position:absolute;width:18px;height:18px;border:1px solid rgba(201,168,107,.4);pointer-events:none;z-index:5}
  .corner.tl{top:14px;left:14px;border-right:0;border-bottom:0}.corner.tr{top:14px;right:14px;border-left:0;border-bottom:0}
  .corner.bl{bottom:14px;left:14px;border-right:0;border-top:0}.corner.br{bottom:14px;right:14px;border-left:0;border-top:0}
</style></head><body>

// ====== background động nhẹ (đã tối ưu) ======
const cv=document.getElementById('bg'),cx=cv.getContext('2d');let BW,BH;
function rs(){BW=cv.width=innerWidth;BH=cv.height=innerHeight;}rs();addEventListener('resize',rs);
const dots=[...Array(40)].map(()=>({x:Math.random(),y:Math.random(),z:.3+Math.random()*.7,r:.6+Math.random()*1.3,p:Math.random()*6.28,vx:(Math.random()-.5)*.00006,vy:(Math.random()-.5)*.00006}));
function bokSprite(color,r){const c=document.createElement('canvas');c.width=c.height=r*2;const g=c.getContext('2d');const gr=g.createRadialGradient(r,r,0,r,r,r);gr.addColorStop(0,`rgba(${color},.18)`);gr.addColorStop(1,`rgba(${color},0)`);g.fillStyle=gr;g.fillRect(0,0,r*2,r*2);return c;}
const bok=[{c:'30,120,200',vx:.00004,vy:.00003,x:.25,y:.3,r:230},{c:'201,168,107',vx:-.00003,vy:.00004,x:.74,y:.66,r:210},{c:'92,143,240',vx:.00003,vy:-.00003,x:.6,y:.2,r:180}];
bok.forEach(b=>b.sp=bokSprite(b.c,b.r));
let mxb=.5,myb=.5;addEventListener('mousemove',e=>{mxb=e.clientX/innerWidth;myb=e.clientY/innerHeight});
let bt=0;function drawBg(){bt+=.016;cx.clearRect(0,0,BW,BH);cx.globalCompositeOperation='lighter';
 bok.forEach(b=>{b.x+=b.vx;b.y+=b.vy;if(b.x<0||b.x>1)b.vx*=-1;if(b.y<0||b.y>1)b.vy*=-1;
  const gx=(b.x+(mxb-.5)*.04)*BW,gy=(b.y+(myb-.5)*.04)*BH;cx.drawImage(b.sp,gx-b.r,gy-b.r);});
 for(const d of dots){d.x+=d.vx;d.y+=d.vy;if(d.x<0)d.x=1;if(d.x>1)d.x=0;if(d.y<0)d.y=1;if(d.y>1)d.y=0;
  const px=(d.x+(mxb-.5)*.06*d.z)*BW,py=(d.y+(myb-.5)*.06*d.z)*BH,a=(.32+Math.sin(bt*.8+d.p)*.28)*d.z;
  cx.globalAlpha=a<0?0:a;cx.beginPath();cx.arc(px,py,d.r*d.z,0,6.29);cx.fillStyle='#96c8ff';cx.fill();}
 cx.globalAlpha=1;cx.globalCompositeOperation='source-over';requestAnimationFrame(drawBg);}
requestAnimationFrame(drawBg);

const SVGNS='http://www.w3.org/2000/svg';
const field=document.getElementById('field');
const ELL=[{rx:47,ry:30,rot:0,c:'#4FE5FF',dur:14,rev:false,op:.20,dash:''},
{rx:43,ry:17,rot:36,c:'#C9A86B',dur:17,rev:true,op:.16,dash:'1.4 2.6'},
{rx:39,ry:27,rot:74,c:'#7C9BD6',dur:11,rev:false,op:.18,dash:''},
{rx:48,ry:13,rot:116,c:'#4FE5FF',dur:19,rev:true,op:.14,dash:'1 3'},
{rx:34,ry:23,rot:152,c:'#9FE6FF',dur:9,rev:false,op:.20,dash:''}];
ELL.forEach((e,i)=>{const path=`M ${-e.rx} 0 A ${e.rx} ${e.ry} 0 1 1 ${e.rx} 0 A ${e.rx} ${e.ry} 0 1 1 ${-e.rx} 0 Z`;
 const g=document.createElementNS(SVGNS,'g');g.setAttribute('transform',`rotate(${e.rot})`);
 const ring=document.createElementNS(SVGNS,'path');ring.setAttribute('d',path);ring.setAttribute('class','ring');ring.setAttribute('stroke',e.c);ring.setAttribute('stroke-opacity',e.op);ring.setAttribute('stroke-width','0.4');if(e.dash)ring.setAttribute('stroke-dasharray',e.dash);g.appendChild(ring);
 const id='ep'+i;const mp=document.createElementNS(SVGNS,'path');mp.setAttribute('id',id);mp.setAttribute('d',path);mp.setAttribute('fill','none');mp.setAttribute('stroke','none');g.appendChild(mp);
 const el=document.createElementNS(SVGNS,'circle');el.setAttribute('r','0.9');el.setAttribute('fill',e.c);el.setAttribute('filter','url(#eglow)');
 const am=document.createElementNS(SVGNS,'animateMotion');am.setAttribute('dur',e.dur+'s');am.setAttribute('repeatCount','indefinite');if(e.rev){am.setAttribute('keyPoints','1;0');am.setAttribute('keyTimes','0;1');am.setAttribute('calcMode','linear');}
 const mpath=document.createElementNS(SVGNS,'mpath');mpath.setAttributeNS('http://www.w3.org/1999/xlink','href','#'+id);mpath.setAttribute('href','#'+id);am.appendChild(mpath);el.appendChild(am);g.appendChild(el);
 field.appendChild(g);});

const orbit=document.getElementById('orbit'),stage=document.getElementById('stage'),beams=document.getElementById('beams');
const nodesArr=[];
function mkLine(cls){const L=document.createElementNS(SVGNS,'line');L.setAttribute('class',cls);L.setAttribute('x1','50');L.setAttribute('y1','50');L.setAttribute('x2','50');L.setAttribute('y2','50');if(cls!=='bbase')L.setAttribute('filter','url(#bglow)');beams.appendChild(L);return L;}
SEC.forEach(s=>{const base=s.ang*Math.PI/180;
 const n=document.createElement('div');n.className='node';
 n.innerHTML=`<div class="float"><div class="node3d" style="--c:${s.color};--cg:${s.color}55"><div class="aura"></div><div class="bezel"></div><div class="spark"></div><div class="orb"><span class="shine"></span><span class="ic">${ICON[s.id]}</span><span class="lb">${s.label}</span><span class="sb">${s.sub}</span></div></div></div>`;
 n.querySelector('.node3d').onclick=()=>openSec(s.id);orbit.appendChild(n);nodesArr.push({el:n,base,lines:[mkLine('bbase'),mkLine('bflow'),mkLine('bflow2')]});});
let hover=false;stage.onmouseenter=()=>hover=true;stage.onmouseleave=()=>hover=false;
let tt=0;
function loop(){if(!cur&&!hover)tt+=0.0014;
 const R=(stage.clientWidth/2)||250,rx=R*0.96,ry=R*0.5;
 nodesArr.forEach(o=>{const a=o.base+tt,c=Math.cos(a),sn=Math.sin(a);
  o.el.style.transform=`translate(${(c*rx).toFixed(1)}px,${(sn*ry).toFixed(1)}px) translate(-50%,-50%) scale(${(1+sn*0.06).toFixed(3)})`;o.el.style.zIndex=String(10+Math.round(sn*10));
  const vx=(50+c*rx/R*50).toFixed(2),vy=(50+sn*ry/R*50).toFixed(2);o.lines.forEach(L=>{L.setAttribute('x2',vx);L.setAttribute('y2',vy);});});
 requestAnimationFrame(loop);}
requestAnimationFrame(loop);

 pin.innerHTML=g;}
